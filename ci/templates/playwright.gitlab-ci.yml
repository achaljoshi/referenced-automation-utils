# ============================================================================
# Shared GitLab CI building blocks for the referenced-automation repos.
#
# Include it from a repo's .gitlab-ci.yml (same GitLab instance), then extend the hidden jobs:
#
#   include:
#     - project: '<group>/referenced-automation-utils'
#       ref: main                      # or a tag, to pin the pipeline
#       file: '/ci/templates/playwright.gitlab-ci.yml'
#
#   stages: [build, test, report]
#
#   test:
#     extends: .automation-test-sharded     # runs the suite in N parallel shards
#     needs: ["build"]
#   merge-reports:
#     extends: .automation-merge-reports    # one HTML report + run summary from all shards
#     needs: ["test"]
#   security:
#     extends: .automation-security
#     needs: ["build"]
#
# Nothing here knows about registries or credentials: NPM_REGISTRY_URL (and, if your Artifactory mirrors the browser
# CDN, PLAYWRIGHT_DOWNLOAD_HOST) are CI/CD variables. A repo that needs its sibling packages built first (utils, ui...)
# does that in its own `before_script`/`script`, as the existing .gitlab-ci.yml files do.
#
# NOT VERIFIED on a real GitLab: written from GitLab's and Playwright's documented behaviour and checked for YAML
# structure only (see tests/ciTemplate.spec.ts). Run one pipeline and fix what it says before relying on it.
# ============================================================================

variables:
  # How many parallel shards `.automation-test-sharded` splits the suite into. Override per project.
  AUTOMATION_SHARDS: "3"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm-cache"

.automation-registry:
  before_script:
    - if [ -n "${NPM_REGISTRY_URL:-}" ]; then npm config set registry "$NPM_REGISTRY_URL"; fi
    - if [ -n "${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]; then export PLAYWRIGHT_DOWNLOAD_HOST; fi

# Dependency audit + secret scan. allow_failure until it has run green on your GitLab, then flip it.
.automation-security:
  extends: .automation-registry
  stage: test
  allow_failure: true
  script:
    - npm ci
    - npx automation-scan-secrets
    - npx automation-audit-gate

# The suite split into shards that run in parallel. Each shard writes a blob report; `.automation-merge-reports`
# turns them into one report. A shard that fails fails the pipeline; retries are the Playwright config's job (RETRIES).
.automation-test-sharded:
  extends: .automation-registry
  stage: test
  parallel:
    matrix:
      - SHARD: ["1/3", "2/3", "3/3"]   # keep in step with AUTOMATION_SHARDS
  script:
    - npm ci
    - npx playwright install chromium
    - npx playwright test --shard="$SHARD" --reporter=blob
  artifacts:
    when: always
    paths:
      - blob-report/
      - test-results/
    expire_in: 7 days

# One HTML report, one JUnit file (for GitLab's test tab) and the run summary (failures, flaky tests, slowest tests,
# repeat offenders across runs) from all the shards' blob reports.
.automation-merge-reports:
  extends: .automation-registry
  stage: report
  when: always
  script:
    - npm ci
    - PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/results.json npx playwright merge-reports --reporter=json ./blob-report
    - PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/junit.xml npx playwright merge-reports --reporter=junit ./blob-report
    - npx playwright merge-reports --reporter=html ./blob-report
    - npx automation-run-report --input test-results/results.json --out test-results/run-report.md --history .ci-history/history.jsonl --append
  cache:
    key: automation-history
    paths:
      - .ci-history/
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/run-report.md
    reports:
      junit: test-results/junit.xml
    expire_in: 30 days
