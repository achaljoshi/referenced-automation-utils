# ============================================================================
# GitLab CI pipeline for referenced-automation-utils.
#
# This is a pure Java library (no browser, no Cucumber) so the pipeline is
# intentionally simpler than referenced-automation-ui/-api/-sap:
#
#   build   - compile main + test sources
#   test    - run the JUnit 5 unit test suite
#   deploy  - `mvn deploy` the jar to Nexus (main branch / tags only)
# ============================================================================

image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"

cache:
  key: "$CI_COMMIT_REF_SLUG-m2"
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/classes
      - target/test-classes
    expire_in: 1 hour

test:
  stage: test
  script:
    - ./mvnw $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 30 days

deploy:
  stage: deploy
  script:
    - |
      cat > ci-settings.xml <<EOF
      <settings>
        <servers>
          <server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
          <server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
        </servers>
      </settings>
      EOF
    - ./mvnw $MAVEN_CLI_OPTS -s ci-settings.xml -DskipTests deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
